name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      AI_PROXY_CONFIG: /tmp/ai-proxy-ci-config
      AI_PROXY_DATA: /tmp/ai-proxy-ci-data
      AI_PROXY_STATE: /tmp/ai-proxy-ci-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tests/prepare_core.py
      - run: python3 tests/integration.py
      - run: python3 tests/traffic_integration.py
      - run: python3 scripts/audit_staged.py
